specificationVersion: jobtemplate-2023-09
extensions: [FEATURE_BUNDLE_1, TASK_CHUNKING, EXPR]
name: 3ds Max V-Ray Render
description: |
  This job bundle renders a 3ds Max scene using V-Ray with frame chunking support.
  
  Features:
  - Frame chunking for efficient parallel rendering
  - VRIMG to EXR conversion with denoising preservation
  - Automatic cleanup of temporary files
  - Error handling and validation
  
  Requirements:
  - 3ds Max 2025 installed on Windows worker hosts
  - V-Ray plugin for 3ds Max

parameterDefinitions:

# Render Parameters
- name: SceneFile
  type: path
  objectType: FILE
  dataFlow: IN
  userInterface:
    control: CHOOSE_INPUT_FILE
    label: 3ds Max Scene File
    groupLabel: Render Parameters
    fileFilters:
    - label: 3ds Max Scene Files
      patterns: ["*.max"]
    - label: All Files
      patterns: ["*"]
  description: Choose the 3ds Max scene file you want to render.
- name: Frames
  type: range_expr
  default: "0-10"
  userInterface:
    control: LINE_EDIT
    label: Frames
    groupLabel: Render Parameters
  description: Frame range to render (e.g., 1-100, 1,5,10-20)
- name: OutputDirectory
  type: path
  objectType: DIRECTORY
  dataFlow: OUT
  userInterface:
    control: CHOOSE_DIRECTORY
    label: Output Directory
    groupLabel: Render Parameters
  description: Choose the render output directory.
- name: FramesPerTask
  type: int
  default: 1
  minValue: 1
  userInterface:
    control: SPIN_BOX
    label: Frames Per Task
    groupLabel: Render Parameters
  description: Number of frames to render per task

steps:
- name: Render EXRs
  parameterSpace:
    taskParameterDefinitions:
    - name: Frame
      type: CHUNK[INT]
      range: "{{ Param.Frames }}"
      chunks:
        defaultTaskCount: "{{ Param.FramesPerTask }}"
        rangeConstraint: CONTIGUOUS
  script:
    embeddedFiles:
    - name: render_script
      filename: render.bat
      type: TEXT
      runnable: true
      data: |
        @echo off
        setlocal enabledelayedexpansion
        echo Starting 3ds Max render...
        echo Scene: {{ Param.SceneFile }}
        echo Rendering frames {{ min(Task.Param.Frame) }} to {{ max(Task.Param.Frame) }}
        
        REM Validate output directory
        mkdir {{ repr_cmd(Param.OutputDirectory) }} 2>nul
        echo test > {{ repr_cmd(Param.OutputDirectory / 'test.tmp') }} 2>nul || (
          echo ERROR: Cannot write to output directory
          exit /b 1
        )
        del {{ repr_cmd(Param.OutputDirectory / 'test.tmp') }} 2>nul
        
        REM Check vrimg2exr exists
        if not exist "C:\ProgramData\Autodesk\ApplicationPlugins\VRay3dsMax2025\bin\vrimg2exr.exe" (
          echo ERROR: vrimg2exr.exe not found
          exit /b 1
        )
        
        REM Render frame range for this chunk
        "C:\Program Files\Autodesk\3ds Max 2025\3dsmaxcmd.exe" -start:{{ min(Task.Param.Frame) }} -end:{{ max(Task.Param.Frame) }} {{ repr_cmd(Param.SceneFile) }}
        if %ERRORLEVEL% NEQ 0 (
          echo ERROR: 3dsmaxcmd failed with exit code %ERRORLEVEL%
          exit /b %ERRORLEVEL%
        )
        
        echo 3ds Max render completed successfully
        echo Converting .vrimg files to .exr and moving to output...
        set converted=0
        set {{ repr_cmd('OUTPUT_DIR=' + Param.OutputDirectory) }}
        for %%f in ("C:\temp\*.vrimg") do (
          if exist "!OUTPUT_DIR!\%%~nf.exr" (
            echo Skipping %%~nxf - EXR exists
          ) else (
            echo Converting %%~nxf...
            "C:\ProgramData\Autodesk\ApplicationPlugins\VRay3dsMax2025\bin\vrimg2exr.exe" "%%f" "!OUTPUT_DIR!\%%~nf.exr"
            if !errorlevel! equ 0 (
              echo Converted %%~nxf to EXR
              del "%%f" >nul 2>&1
              set /a converted+=1
            ) else (
              echo Failed to convert %%~nxf
            )
          )
        )
        echo Converted !converted! files to EXR
        del "C:\temp\*.vrimg" >nul 2>&1
        dir "!OUTPUT_DIR!\*.exr" /b 2>nul || echo No EXR files
    actions:
      onRun:
        command: "{{ Task.File.render_script }}"
        cancelation:
          mode: NOTIFY_THEN_TERMINATE
